# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: 'ko-KR'

early_access: false

reviews:
  profile: 'assertive'

  high_level_summary: false
  request_changes_workflow: true
  review_status: true
  poem: false

  instructions: |
    모든 리뷰 코멘트는 반드시 한국어로 작성한다.

    리뷰 제목, 문제 설명, 원인, 영향, 수정 방법 및 제안 사항을
    가능한 한 모두 한국어로 작성한다.

    영어로 된 코드, 변수명, 함수명, 라이브러리명,
    API 이름 및 기술 용어는 원문 그대로 사용해도 된다.
    단, 해당 용어를 설명하는 문장은 반드시 한국어로 작성한다.

    영어 문장으로 리뷰하지 않는다.
    개발자가 바로 이해하고 수정할 수 있도록 간결하고 명확한 한국어로 작성한다.

    리뷰 코멘트는 다음 순서로 작성한다.
    1. 무엇이 문제인지
    2. 왜 문제가 되는지
    3. 어떻게 수정하면 되는지

    단순한 개인 취향이나 스타일 차이는 문제로 지적하지 않는다.

    실제 버그, 보안 문제, 런타임 오류,
    API 통신 문제, 상태 관리 문제, 사용자 경험 문제,
    성능 문제를 우선적으로 리뷰한다.

    프로젝트에 정의되지 않은 새로운 패턴이나 라이브러리를
    임의로 강제하지 않는다.

    기존 프로젝트 코드와 일관된 구현이라면
    단순히 다른 구현 방식이라는 이유로 변경을 요구하지 않는다.

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - 'develop'

  path_instructions:
    # ==================================================
    # 전체 JavaScript / React 코드
    # 2026 ONE FRONTEND CODING CONVENTION
    # ==================================================

    - path: 'src/**/*.{js,jsx}'
      instructions: |
        이 프로젝트의 JavaScript / React 코드는
        2026 ONE FRONTEND CODING CONVENTION을 기본 리뷰 기준으로 사용한다.

        [공통 원칙]

        - 처음 보는 개발자가 코드를 이해할 수 있도록 작성한다.
        - 가독성과 유지보수성을 우선한다.
        - 기존 프로젝트의 일관된 구현을 우선한다.
        - 단순한 개인 취향이나 스타일 차이는 과도하게 지적하지 않는다.
        - 실제 버그와 런타임 오류 가능성을 우선적으로 지적한다.
        - API 통신, 상태 관리, 사용자 경험에 영향을 주는 문제를 우선한다.
        - 프로젝트에 정의되지 않은 새로운 패턴이나 라이브러리를 임의로 강제하지 않는다.
        - 변경 범위와 관계없는 기존 코드를 불필요하게 수정하도록 요구하지 않는다.

        [프로젝트 구조]

        src/
        - apis/: API 호출 함수
        - assets/: 이미지, 폰트, 3D 모델
        - components/: 재사용 컴포넌트
        - components/common/: 공통 UI 컴포넌트
        - components/layout/: Header, Footer, Sidebar 등
        - pages/: 라우트 단위 페이지
        - pages/visitor/: 방문자 페이지
        - pages/admin/: 관리자 페이지
        - three/: Three.js 관련 코드
        - three/scenes/: Three.js Scene
        - three/models/: Three.js 모델 관련 코드
        - three/utils/: Three.js 유틸 함수
        - hooks/: 커스텀 Hook
        - stores/: Zustand Store
        - styles/: 전역 스타일
        - utils/: 순수 유틸 함수
        - constants/: 상수
        - App.jsx
        - main.jsx

        - pages에는 라우트와 1:1로 매칭되는 페이지만 둔다.
        - 페이지의 재사용 가능한 UI는 components로 분리한다.
        - 반복되는 상태 로직은 hooks 또는 stores로 분리한다.
        - API 호출은 apis에서 담당한다.
        - Three.js 관련 코드는 three 폴더에 둔다.
        - 한 폴더에 파일이 10개 이상 쌓이면 하위 폴더 분리를 검토한다.

        [파일 네이밍]

        - 컴포넌트: PascalCase.jsx
        - 페이지: PascalCase.jsx
        - 일반 JavaScript: camelCase.js
        - Hook: use 접두사의 camelCase
        - Store: camelCase + Store
        - Utility: camelCase.js
        - API: camelCase.js
        - 폴더: camelCase
        - Three.js 모델: kebab-case
        - CSS Module: ComponentName.module.css

        [변수 / 함수]

        - 변수: camelCase
        - 함수: camelCase
        - 컴포넌트: PascalCase
        - 상수: UPPER_SNAKE_CASE
        - Boolean 변수: is / has / can / should 접두사
        - 이벤트 핸들러: handle 접두사
        - props로 전달되는 핸들러: on 접두사

        [네이밍 금지 사항]

        - 의미 없는 약어를 사용하지 않는다.
        - btn -> button
        - usr -> user
        - tmp -> temporary
        - 한글 변수명을 사용하지 않는다.
        - data, info, value처럼 의미가 모호한 이름을 단독으로 사용하지 않는다.
        - 필요한 경우 userData, recruitInfo처럼 맥락을 포함한다.

        [React 컴포넌트]

        - 함수형 컴포넌트만 사용한다.
        - Class Component를 사용하지 않는다.
        - 한 파일에는 하나의 컴포넌트를 둔다.
        - 파일당 default export는 하나를 사용한다.
        - 컴포넌트가 150줄을 초과하면 분리를 검토한다.
        - 컴포넌트가 250줄을 초과하면 반드시 분리를 요구한다.
        - props가 5개를 초과하면 객체로 묶거나 컴포넌트 구조를 재검토한다.
        - 재사용 가능한 컴포넌트는 components에 둔다.
        - 라우트와 직접 매칭되는 페이지는 pages에 둔다.

        [컴포넌트 내부 코드 순서]

        다음 순서를 우선한다.

        1. import
        2. 컴포넌트 함수 선언
        3. 상태 선언
        4. 외부 데이터 호출 Hook 또는 useEffect
        5. 이벤트 핸들러
        6. 파생 변수
        7. 조건부 early return
        8. JSX 반환
        9. export default

        [조건부 렌더링]

        - 삼항 연산자는 1단까지만 사용한다.
        - 중첩 삼항 연산자를 사용하지 않는다.
        - 복잡한 조건은 변수로 분리한다.
        - loading / error / empty 상태는 필요에 따라 early return을 사용한다.

        [React 최적화]

        - 부모 리렌더링으로 불필요한 자식 렌더링이 발생하는 경우 React.memo 사용을 고려한다.
        - 자식 컴포넌트에 콜백 prop을 전달하고 메모이제이션이 필요한 경우 useCallback을 사용한다.
        - 정렬, 필터 등 계산 비용이 높은 파생 값에는 useMemo를 사용한다.
        - 단순한 함수에 성능 최적화를 목적으로 무조건 useCallback이나 useMemo를 사용하지 않는다.

        [CSS / Styling]

        - 기본 스타일링은 프로젝트에서 선택한 Tailwind CSS 방식을 따른다.
        - 복잡한 애니메이션이나 글로벌 스타일은 styles에 분리한다.
        - 인라인 style은 동적 값에만 사용한다.
        - CSS Modules를 사용하는 경우 클래스명은 camelCase를 사용한다.
        - 색상과 폰트를 임의의 하드코딩 값으로 사용하지 않는다.
        - 프로젝트의 디자인 토큰 또는 constants/theme.js를 우선한다.

        [반응형]

        - Mobile First를 기본으로 한다.
        - Tailwind 기본 breakpoint를 사용한다.
        - sm: 640px
        - md: 768px
        - lg: 1024px
        - xl: 1280px

        [Zustand]

        - Store는 도메인 단위로 분리한다.
        - authStore, recruitStore, uiStore 등 도메인별 Store 구조를 우선한다.
        - UI 상태는 필요한 경우 uiStore로 분리한다.
        - 컴포넌트에서는 필요한 상태와 액션만 selector로 구독한다.
        - 전체 Store를 구독하여 불필요한 리렌더링이 발생하지 않는지 확인한다.
        - 서버 데이터 캐싱이 필요한 경우 TanStack Query 사용을 고려한다.
        - Store가 UI 컴포넌트의 렌더링 로직까지 담당하지 않도록 한다.

        [API]

        - 모든 API 요청은 apis/ 폴더의 함수를 통해 호출한다.
        - 컴포넌트에서 axios.get(), axios.post() 등을 직접 호출하지 않는다.
        - src/apis/instance.js의 공통 Axios instance를 사용한다.
        - API Base URL과 timeout 등 공통 설정은 instance.js에서 관리한다.
        - API URL을 컴포넌트에 하드코딩하지 않는다.
        - API 함수와 UI 컴포넌트의 책임을 분리한다.

        [에러 처리]

        - 모든 비동기 호출은 적절하게 에러를 처리한다.
        - 빈 catch를 작성하지 않는다.
        - 사용자에게 표시되는 에러 메시지는 상수로 관리한다.
        - console 로그가 필요한 경우 [컴포넌트명] 에러내용 형식을 사용한다.
        - API 에러와 UI 에러를 적절하게 구분한다.

        [Import]

        다음 순서를 우선한다.

        1. React 및 외부 라이브러리
        2. 절대 경로 내부 모듈
        3. 상대 경로 내부 모듈
        4. 스타일 및 에셋

        각 그룹 사이에는 빈 줄을 둔다.

        @ 별칭을 사용하는 경우 상대 경로 ../../../ 형태의 과도한 import를 사용하지 않는다.
        단, 같은 폴더 내 파일은 상대 경로 사용을 허용한다.

        [리뷰 우선순위]

        다음 순서로 문제를 판단한다.

        1. 실제 버그
        2. 보안 문제
        3. 런타임 오류 가능성
        4. API 통신 문제
        5. 상태 관리 문제
        6. 사용자 경험 문제
        7. 성능 문제
        8. 프로젝트 Coding Convention 위반
        9. 단순 스타일 문제

        단순한 개인 취향이나 스타일 차이는 request changes의 근거로 사용하지 않는다.

    # ==================================================
    # Components
    # ==================================================

    - path: 'src/components/**/*.{js,jsx}'
      instructions: |
        Component 추가 리뷰 기준:

        - 재사용 가능한 UI 컴포넌트인지 확인한다.
        - 하나의 컴포넌트가 지나치게 많은 책임을 가지지 않는지 확인한다.
        - 함수형 컴포넌트만 사용한다.
        - Class Component를 사용하지 않는다.
        - 파일당 하나의 컴포넌트를 사용한다.
        - 150줄을 초과하는 경우 분리를 검토한다.
        - 250줄을 초과하면 반드시 분리를 요구한다.
        - props가 5개를 초과하는 경우 구조를 재검토한다.
        - 리스트 아이템은 필요한 경우 별도 컴포넌트로 분리한다.
        - Boolean props는 is/has/can/should 등의 명확한 이름을 사용한다.
        - 이벤트 핸들러는 handle 접두사를 사용한다.
        - props로 전달되는 핸들러는 on 접두사를 사용한다.

    # ==================================================
    # Pages
    # ==================================================

    - path: 'src/pages/**/*.{js,jsx}'
      instructions: |
        Page 추가 리뷰 기준:

        - React Router의 라우트와 1:1로 매칭되는 페이지인지 확인한다.
        - pages에 재사용 가능한 일반 컴포넌트를 직접 작성하지 않는다.
        - 재사용 가능한 UI는 components로 분리한다.
        - 반복되는 상태 로직은 hooks 또는 stores로 분리한다.
        - API 요청을 직접 axios로 호출하지 않고 apis를 사용하는지 확인한다.
        - 복잡한 페이지는 pages/{domain}/ 구조로 분리한다.
        - 조건부 렌더링이 지나치게 복잡하지 않은지 확인한다.
        - loading / error / empty 상태가 필요한 페이지에서 적절하게 처리되는지 확인한다.

    # ==================================================
    # Hooks
    # ==================================================

    - path: 'src/hooks/**/*.{js,jsx}'
      instructions: |
        Hook 추가 리뷰 기준:

        - Hook 파일은 use 접두사를 사용한다.
        - 하나의 Hook이 지나치게 많은 책임을 가지지 않는지 확인한다.
        - Hook 내부에서 사용하는 상태와 effect의 의존성이 올바른지 확인한다.
        - useEffect dependency array가 실제 사용 값과 일치하는지 확인한다.
        - 불필요한 useEffect 사용을 지적한다.
        - 컴포넌트에서 반복되는 로직을 적절하게 Hook으로 분리했는지 확인한다.
        - Hook이 특정 UI에 과도하게 종속되어 있지 않은지 확인한다.

    # ==================================================
    # Stores
    # ==================================================

    - path: 'src/stores/**/*.{js,jsx}'
      instructions: |
        Zustand Store 추가 리뷰 기준:

        - Store는 도메인 단위로 분리한다.
        - UI 상태와 도메인 상태를 필요에 따라 분리한다.
        - 컴포넌트에서 필요한 값만 selector로 구독하도록 한다.
        - 전체 Store를 불필요하게 구독하지 않는지 확인한다.
        - Store가 UI 컴포넌트의 렌더링 로직까지 담당하지 않는지 확인한다.
        - 동일한 상태를 여러 Store에서 중복 관리하지 않는지 확인한다.
        - 서버 데이터 관리가 필요한 경우 적절한 캐싱 전략을 고려한다.

    # ==================================================
    # APIs
    # ==================================================

    - path: 'src/apis/**/*.{js,jsx}'
      instructions: |
        API 추가 리뷰 기준:

        - API 호출은 apis/에서 담당한다.
        - 컴포넌트에서 직접 axios 요청을 하지 않는다.
        - 공통 Axios instance를 사용한다.
        - API URL을 컴포넌트에 하드코딩하지 않는다.
        - Request와 Response 데이터 구조를 명확하게 관리한다.
        - API 함수와 UI 컴포넌트의 책임을 분리한다.
        - 동일한 API 설정이나 로직이 중복되지 않는지 확인한다.
        - 비동기 요청의 에러가 적절하게 처리되는지 확인한다.
        - 인증이 필요한 API는 공통 Axios instance의 인증 처리 방식을 우선한다.

    # ==================================================
    # Three.js
    # ==================================================

    - path: 'src/three/**/*.{js,jsx}'
      instructions: |
        Three.js 추가 리뷰 기준:

        - React Three Fiber(@react-three/fiber)를 통한 선언적 구현을 우선한다.
        - 정말 필요한 경우를 제외하고 new THREE.Scene() 등의 명령형 구현을 지양한다.
        - Three.js 관련 코드는 src/three/ 아래에 둔다.
        - 재사용 가능한 Scene, Model, Utility는 적절한 하위 폴더로 분리한다.
        - 3D 모델은 assets/models/에 둔다.
        - 모델 파일명은 kebab-case를 사용한다.

        [성능]

        - geometry, material, texture의 불필요한 생성을 방지한다.
        - 재사용 가능한 geometry/material은 useMemo 사용을 고려한다.
        - useEffect에서 직접 생성한 Three.js 리소스는 필요한 경우 cleanup에서 dispose한다.
        - 3D 모델은 useGLTF.preload()를 사용하여 초기 진입 지연을 줄이는 것을 고려한다.
        - 모바일 환경에서 과도한 그림자와 안티앨리어싱 사용을 지양한다.
        - 3D 모델 파일은 5MB 이하를 권장한다.
        - 가능한 경우 Draco 압축을 사용한다.

        [매직 넘버]

        - 카메라 위치, FOV, 회전 속도, 빛의 세기 등 의미 있는 값은 상수로 분리한다.
        - 예:
          CAMERA_POSITION
          ROTATION_SPEED
          LIGHT_INTENSITY

        - 컴포넌트 내부에 의미를 알기 어려운 숫자를 반복해서 사용하지 않는다.

    # ==================================================
    # Utils
    # ==================================================

    - path: 'src/utils/**/*.{js,jsx}'
      instructions: |
        Utility 추가 리뷰 기준:

        - 순수 함수 형태를 우선한다.
        - 특정 Page나 Component에 종속된 로직은 utils에 넣지 않는다.
        - 동일한 유틸 함수가 중복 구현되지 않는지 확인한다.
        - 함수 이름은 실제 동작을 명확하게 표현한다.
        - 입력값과 반환값의 형태가 명확한지 확인한다.
        - 외부 상태를 직접 변경하는 유틸 함수를 지양한다.

    # ==================================================
    # Constants
    # ==================================================

    - path: 'src/constants/**/*.{js,jsx}'
      instructions: |
        Constants 추가 리뷰 기준:

        - 여러 곳에서 사용하는 상수는 constants에서 관리한다.
        - 모듈 레벨 상수는 UPPER_SNAKE_CASE를 사용한다.
        - 색상과 폰트 등 디자인 토큰은 constants/theme.js 또는
          프로젝트의 기존 디자인 시스템을 우선한다.
        - 동일한 값을 여러 파일에서 하드코딩하지 않는다.
        - Three.js의 카메라, 조명, 애니메이션 관련 매직 넘버도 필요한 경우 상수화한다.

    # ==================================================
    # Assets
    # ==================================================

    - path: 'src/assets/**/*'
      instructions: |
        Asset 추가 리뷰 기준:

        - 프로젝트에서 사용하는 기존 Asset 구조를 따른다.
        - 이미지, 폰트, 3D 모델을 목적에 맞는 하위 폴더에 분리한다.
        - 3D 모델은 assets/models/에 둔다.
        - 3D 모델 파일명은 kebab-case를 사용한다.
        - 불필요하게 큰 Asset을 추가하지 않는다.

    # ==================================================
    # Anti-patterns
    # ==================================================

    - path: 'src/**/*.{js,jsx}'
      instructions: |
        다음 패턴은 실제 문제 가능성이 있는 경우 적극적으로 지적한다.

        - Class Component 사용
        - 컴포넌트에서 직접 axios 호출
        - 공통 Axios instance를 사용하지 않는 API 호출
        - 전체 Zustand Store 구독
        - 중첩 삼항 연산자
        - 과도하게 긴 Component
        - 과도하게 많은 props
        - 의미 없는 변수명
        - 의미 없는 약어
        - 한글 변수명
        - 색상 및 폰트의 하드코딩
        - API URL 하드코딩
        - 불필요한 인라인 style
        - 과도한 useEffect 사용
        - 잘못된 useEffect dependency
        - 불필요한 useCallback / useMemo 사용
        - Three.js 리소스의 불필요한 생성
        - Three.js 리소스 cleanup 누락
        - Three.js 매직 넘버
        - 에러를 무시하는 빈 catch
        - 동일 로직의 불필요한 중복

        단, 기존 프로젝트 코드와의 호환성이나 기술적 이유가 명확한 경우
        단순히 해당 패턴이 존재한다는 이유만으로 request changes를 요구하지 않는다.
